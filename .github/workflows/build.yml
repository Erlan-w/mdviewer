name: Build MarkdownViewer

on:
  push:
    branches: [ main, master, develop ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ─── Linux Build ──────────────────────────────────────────────────────────
  build-linux:
    name: Linux (Qt6, GCC)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 + deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            qt6-base-dev \
            libqt6svg6-dev libqt6printsupport6 \
            qt6-base-private-dev \
            qt5-qmake qtbase5-dev libqt5svg5-dev libqt5charts5-dev libqt5printsupport5-dev \
            cmake ninja-build gcc g++ \
            libgl1-mesa-dev libglu1-mesa-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O2"

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownViewer-linux-x86_64
          path: build/MarkdownViewer
          retention-days: 14

  # ─── Windows Build (Qt via aqtinstall) ────────────────────────────────────
  build-windows:
    name: Windows (Qt6, MSVC)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aqtinstall
        run: pip install aqtinstall

      - name: Install Qt6 via aqt
        run: |
          aqt install-qt windows desktop 6.5.3 win64_msvc2019_64 `
            --modules qtcharts `
            --outputdir C:\Qt
        shell: pwsh

      - name: Set Qt env
        shell: pwsh
        run: |
          $qtDir = "C:\Qt\6.5.3\msvc2019_64"
          echo "Qt6_DIR=$qtDir\lib\cmake\Qt6"         >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$qtDir"             >> $env:GITHUB_ENV
          echo "$qtDir\bin"                           >> $env:GITHUB_PATH

      - name: Configure (MSVC)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build -G "NMake Makefiles" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH=C:\Qt\6.5.3\msvc2019_64

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build

      - name: Deploy Qt (windeployqt)
        shell: cmd
        run: |
          mkdir deploy
          copy build\MarkdownViewer.exe deploy\
          C:\Qt\6.5.3\msvc2019_64\bin\windeployqt.exe ^
            --release --no-translations ^
            --no-system-d3d-compiler deploy\MarkdownViewer.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownViewer-windows-x64
          path: deploy\
          retention-days: 14

  # ─── Release ──────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [ build-linux, build-windows ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: MarkdownViewer-linux-x86_64
          path: artifacts/linux/

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: MarkdownViewer-windows-x64
          path: artifacts/windows/

      - name: Zip Windows build
        run: |
          cd artifacts/windows
          zip -r ../../MarkdownViewer-windows-x64.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/MarkdownViewer
            MarkdownViewer-windows-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
