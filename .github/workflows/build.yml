name: Build MarkdownViewer

on:
  push:
    branches: [ main, master, develop ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ─── Linux Build ───────────────────────────────────────────────────────────
  build-linux:
    name: Linux (Qt6, GCC)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 + deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            qt6-base-dev qt6-charts-dev \
            libqt6svg6-dev libqt6printsupport6 \
            qt6-base-private-dev \
            cmake ninja-build gcc g++ \
            libgl1-mesa-dev libglu1-mesa-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O2"

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Package (AppDir)
        run: |
          mkdir -p appdir/usr/bin
          cp build/MarkdownViewer appdir/usr/bin/
          cat > appdir/usr/share/applications/markdownviewer.desktop << 'EOF'
          [Desktop Entry]
          Name=Markdown Viewer
          Exec=MarkdownViewer
          Icon=markdownviewer
          Type=Application
          Categories=Utility;TextEditor;
          EOF
          mkdir -p appdir/usr/share/icons/hicolor/256x256/apps
          # placeholder icon
          touch appdir/usr/share/icons/hicolor/256x256/apps/markdownviewer.png

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownViewer-linux-x86_64
          path: build/MarkdownViewer
          retention-days: 14

  # ─── Windows Build ─────────────────────────────────────────────────────────
  build-windows:
    name: Windows (Qt6, MSVC)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 (Windows)
        uses: jurplel/install-qt-action@v3
        with:
          version:   '6.5.3'
          host:      'windows'
          target:    'desktop'
          arch:      'win64_msvc2019_64'
          modules:   'qtcharts qtsvg'
          cache:     true

      - name: Configure (MSVC)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build -G "NMake Makefiles" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_CXX_FLAGS="/O2 /W3"

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build --config Release

      - name: Deploy Qt (windeployqt)
        shell: cmd
        run: |
          mkdir deploy
          copy build\MarkdownViewer.exe deploy\
          windeployqt --release --no-translations ^
            --no-system-d3d-compiler deploy\MarkdownViewer.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownViewer-windows-x64
          path: deploy\
          retention-days: 14

  # ─── Windows Build (MinGW fallback) ────────────────────────────────────────
  build-windows-mingw:
    name: Windows (Qt6, MinGW)
    runs-on: windows-2022
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 (MinGW)
        uses: jurplel/install-qt-action@v3
        with:
          version:   '6.5.3'
          host:      'windows'
          target:    'desktop'
          arch:      'win64_mingw'
          modules:   'qtcharts qtsvg'
          cache:     true

      - name: Configure (MinGW)
        run: |
          cmake -B build -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 4

      - name: Deploy Qt
        run: |
          mkdir deploy
          copy build\MarkdownViewer.exe deploy\
          windeployqt --release --no-translations deploy\MarkdownViewer.exe

      - name: Upload MinGW artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownViewer-windows-x64-mingw
          path: deploy\
          retention-days: 14

  # ─── Release ───────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [ build-linux, build-windows ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: MarkdownViewer-linux-x86_64
          path: artifacts/linux/

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: MarkdownViewer-windows-x64
          path: artifacts/windows/

      - name: Zip Windows build
        run: |
          cd artifacts/windows
          zip -r ../../MarkdownViewer-windows-x64.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/MarkdownViewer
            MarkdownViewer-windows-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
